<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head('制度查询 · 报销助手（JYP）')"></head>
<body>
<div th:replace="fragments :: nav('policies')"></div>

<div class="wrap">
    <div id="alert" class="alert"></div>

    <h2 class="page-title">制度查询</h2>
    <p class="page-sub">以下为<strong>现行有效制度</strong>（已发布且在生效期内）。制度由行政专员乔姐维护。</p>

    <div class="card">
        <div class="btn-row" style="align-items:center">
            <input id="keyword" placeholder="按制度编号 / 标题 / 类别筛选" style="max-width:320px" oninput="renderValid()">
            <span class="muted" id="validCount"></span>
        </div>
    </div>

    <div class="section-title">有效制度清单</div>
    <div id="validList"></div>

    <!-- ================= 行政专员维护区 ================= -->
    <div th:if="${user != null and user.role.name() == 'ADMIN'}">
        <div class="section-title" id="maintain">制度维护（行政专员）</div>
        <p class="page-sub">
            你正在以行政专员身份维护制度：草稿不外发；发布后进入员工可查范围；归档后保留历史版本但不再对外生效。
            修订正文会自动提升版本号。
        </p>

        <div class="grid cols-2">
            <div class="card">
                <h3 id="formTitle">新增 / 修订制度</h3>
                <input type="hidden" id="policyId">
                <label>制度编号（唯一）</label>
                <input id="code" placeholder="如 BX-TRAVEL-2026">
                <label>制度标题</label>
                <input id="title" placeholder="如 差旅费报销制度">
                <label>归口类别</label>
                <input id="category" placeholder="如 差旅 / 交通 / 餐饮 / 办公 / 招待">
                <label>生效日期</label>
                <input id="effectiveFrom" type="date">
                <label>失效日期（留空表示长期有效）</label>
                <input id="effectiveTo" type="date">
                <label>制度正文（每行一条条款，便于精准检索）</label>
                <textarea id="content" placeholder="城市间交通费按经济舱/二等座标准据实报销…"></textarea>
                <label style="display:flex;align-items:center;gap:8px;font-weight:500">
                    <input type="checkbox" id="publish" style="width:auto"> 保存后立即发布（否则保存为草稿）
                </label>
                <div class="btn-row" style="margin-top:16px">
                    <button class="btn-primary" onclick="savePolicy()">保存</button>
                    <button class="btn-ghost" onclick="resetForm()">清空</button>
                </div>
            </div>

            <div class="card">
                <h3>额度规则（辅助判定）</h3>
                <p class="muted">用自然语言维护各类费用最高额度，供问答时确定性裁决。</p>
                <textarea id="ruleText" placeholder="打车报销不超过100；工作餐不超过80"></textarea>
                <div class="btn-row" style="margin-top:12px">
                    <button class="btn-primary btn-sm" onclick="parseRules()">解析并保存</button>
                </div>
                <div id="ruleList" class="muted" style="margin-top:12px"></div>
            </div>
        </div>

        <div class="section-title">全部制度（含草稿 / 归档）</div>
        <div id="allList"></div>
    </div>
</div>

<script th:src="@{/app.js}"></script>
<script th:inline="javascript">
    const ROLE = /*[[${user != null ? user.role.name() : ''}]]*/ '';
    const alertEl = document.getElementById('alert');
    let validPolicies = [];

    function statusBadge(policy) {
        if (policy.status === 'PUBLISHED') {
            const today = new Date().toISOString().slice(0, 10);
            const from = policy.effectiveFrom;
            const to = policy.effectiveTo;
            const valid = (!from || from <= today) && (!to || to >= today);
            return valid
                ? '<span class="badge PUBLISHED">生效中</span>'
                : '<span class="badge EXPIRED">未在生效期</span>';
        }
        return '<span class="badge ' + policy.status + '">' + (policy.status === 'DRAFT' ? '草稿' : (policy.status === 'ARCHIVED' ? '已归档' : policy.status)) + '</span>';
    }

    function policyCard(policy, admin) {
        const actions = admin ? `
            <div class="btn-row" style="margin-top:10px">
                <button class="btn-ghost btn-sm" onclick='editPolicy(${policy.id})'>修订</button>
                ${policy.status !== 'PUBLISHED' ? `<button class="btn-ok btn-sm" onclick="publish(${policy.id})">发布</button>` : ''}
                ${policy.status !== 'ARCHIVED' ? `<button class="btn-ghost btn-sm" onclick="archive(${policy.id})">归档</button>` : ''}
                <button class="btn-bad btn-sm" onclick="removePolicy(${policy.id})">删除</button>
            </div>` : '';
        return `
        <div class="card" style="margin-bottom:12px">
            <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap">
                <div>
                    <strong>${esc(policy.title)}</strong>
                    <span class="muted"> · ${esc(policy.code)} · v${policy.version}</span>
                </div>
                <div>${statusBadge(policy)} <span class="role-chip">${esc(policy.category)}</span></div>
            </div>
            <div class="muted" style="margin-top:6px">
                生效：${esc(policy.effectiveFrom || '-')} 至 ${esc(policy.effectiveTo || '长期')}
                · 维护人：${esc(policy.maintainedBy || '-')}
            </div>
            <div class="answer" style="margin-top:10px">${esc(policy.content)}</div>
            ${actions}
        </div>`;
    }

    function renderValid() {
        const kw = (document.getElementById('keyword').value || '').trim();
        const list = validPolicies.filter(p =>
            !kw || p.title.includes(kw) || p.code.includes(kw) || p.category.includes(kw));
        document.getElementById('validCount').textContent = '共 ' + list.length + ' 项';
        const box = document.getElementById('validList');
        if (!list.length) {
            box.innerHTML = '<div class="table-card"><div class="empty">没有匹配的有效制度</div></div>';
            return;
        }
        box.innerHTML = list.map(p => policyCard(p, false)).join('');
    }

    async function loadValid() {
        validPolicies = await api('/api/policies/valid');
        renderValid();
    }

    async function loadAdmin() {
        if (ROLE !== 'ADMIN') return;
        const all = await api('/api/policies');
        document.getElementById('allList').innerHTML = all.length
            ? all.map(p => policyCard(p, true)).join('')
            : '<div class="table-card"><div class="empty">暂无制度</div></div>';
        loadRules();
    }

    function editPolicy(id) {
        const p = (window.__allPolicies || []).find(x => x.id === id);
        if (!p) return;
        document.getElementById('code').value = p.code;
        document.getElementById('title').value = p.title;
        document.getElementById('category').value = p.category;
        document.getElementById('content').value = p.content;
        document.getElementById('effectiveFrom').value = p.effectiveFrom || '';
        document.getElementById('effectiveTo').value = p.effectiveTo || '';
        document.getElementById('publish').checked = p.status === 'PUBLISHED';
        document.getElementById('formTitle').textContent = '修订制度：' + p.code;
        document.getElementById('maintain').scrollIntoView({behavior: 'smooth'});
    }

    function resetForm() {
        ['policyId', 'code', 'title', 'category', 'content', 'effectiveFrom', 'effectiveTo']
            .forEach(id => document.getElementById(id).value = '');
        document.getElementById('publish').checked = false;
        document.getElementById('formTitle').textContent = '新增 / 修订制度';
        showAlert(alertEl, '', true);
    }

    async function savePolicy() {
        const body = {
            code: document.getElementById('code').value.trim(),
            title: document.getElementById('title').value.trim(),
            category: document.getElementById('category').value.trim(),
            content: document.getElementById('content').value.trim(),
            effectiveFrom: document.getElementById('effectiveFrom').value || null,
            effectiveTo: document.getElementById('effectiveTo').value || null,
            publish: document.getElementById('publish').checked
        };
        if (!body.code || !body.title || !body.category || !body.content) {
            showAlert(alertEl, '请填写制度编号、标题、类别与正文', false);
            return;
        }
        try {
            await api('/api/policies', {method: 'POST', body});
            showAlert(alertEl, '制度已保存' + (body.publish ? '并发布' : '为草稿'), true);
            resetForm();
            await refresh();
        } catch (e) {
            showAlert(alertEl, e.message, false);
        }
    }

    async function publish(id) {
        try {
            await api('/api/policies/' + id + '/publish', {method: 'POST'});
            showAlert(alertEl, '制度已发布', true);
            await refresh();
        } catch (e) {
            showAlert(alertEl, e.message, false);
        }
    }

    async function archive(id) {
        try {
            await api('/api/policies/' + id + '/archive', {method: 'POST'});
            showAlert(alertEl, '制度已归档', true);
            await refresh();
        } catch (e) {
            showAlert(alertEl, e.message, false);
        }
    }

    async function removePolicy(id) {
        if (!confirm('确认删除该制度？删除后不可恢复（归档更适合保留历史）。')) return;
        try {
            await api('/api/policies/' + id, {method: 'DELETE'});
            showAlert(alertEl, '制度已删除', true);
            await refresh();
        } catch (e) {
            showAlert(alertEl, e.message, false);
        }
    }

    async function parseRules() {
        const text = document.getElementById('ruleText').value.trim();
        if (!text) {
            showAlert(alertEl, '请输入额度规则文本', false);
            return;
        }
        try {
            await api('/api/rules/parse', {method: 'POST', body: {text}});
            showAlert(alertEl, '额度规则已更新', true);
            loadRules();
        } catch (e) {
            showAlert(alertEl, e.message, false);
        }
    }

    async function loadRules() {
        try {
            const rules = await api('/api/rules');
            document.getElementById('ruleList').innerHTML = rules.length
                ? rules.map(r => `<span class="source-tag">${esc(r.category)} ≤ ${money(r.max)}</span>`).join(' ')
                : '暂无额度规则';
        } catch (e) {
            document.getElementById('ruleList').textContent = '';
        }
    }

    async function refresh() {
        await loadValid();
        if (ROLE === 'ADMIN') {
            const all = await api('/api/policies');
            window.__allPolicies = all;
            document.getElementById('allList').innerHTML = all.length
                ? all.map(p => policyCard(p, true)).join('')
                : '<div class="table-card"><div class="empty">暂无制度</div></div>';
        }
    }

    (async function init() {
        try {
            await refresh();
            await loadAdmin();
            if (location.hash === '#maintain' && ROLE === 'ADMIN') {
                document.getElementById('maintain').scrollIntoView({behavior: 'smooth'});
            }
        } catch (e) {
            showAlert(alertEl, e.message, false);
        }
    })();
</script>
</body>
</html>
